          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            addressText: { type: string }
            postalCode: { type: [string, 'null'] }
            city: { type: string }
            district: { type: string }
            timezone: { type: string, const: Asia/Taipei }
            isPublicAddress: { type: boolean }
            status: { type: string, enum: [ACTIVE, INACTIVE] }
        starterService:
          type: object
          required:
            [
              id,
              name,
              description,
              durationMinutes,
              bufferBeforeMinutes,
              bufferAfterMinutes,
              price,
              currency,
              bookingEnabled,
              status,
            ]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            description: { type: [string, 'null'] }
            durationMinutes: { type: integer }
            bufferBeforeMinutes: { type: integer }
            bufferAfterMinutes: { type: integer }
            price: { $ref: '#/components/schemas/ServicePrice' }
            currency: { type: string, const: TWD }
