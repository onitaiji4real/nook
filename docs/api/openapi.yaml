        required: true
        content:
          application/json:
            schema:
              type: object
              description: LINE webhook envelope, limited to 256 KiB and one hundred events
      responses:
        '200':
          description: Envelope accepted, including idempotent event replays
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [accepted, processedCount, replayedCount]
                properties:
                  accepted: { type: boolean, const: true }
                  processedCount: { type: integer, minimum: 0, maximum: 100 }
                  replayedCount: { type: integer, minimum: 0, maximum: 100 }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
