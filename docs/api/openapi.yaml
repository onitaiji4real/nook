      properties:
        mediaAssetId: { type: string, format: uuid }
        status: { type: string, enum: [READY, REJECTED] }
        idempotent: { type: boolean }
    PublicationReadinessItem:
      type: object
      additionalProperties: false
      required: [code, label, ready, actionPath]
      properties:
        code:
          {
            type: string,
            enum:
              [
                PROFILE_CONTENT,
                ACTIVE_LOCATION,
                ACTIVE_SERVICE,
                ACTIVE_STAFF,
                WEEKLY_AVAILABILITY,
                PUBLISHED_PORTFOLIO,
              ],
          }
        label: { type: string }
        ready: { type: boolean }
        actionPath: { type: string }
    MerchantPublicationResponse:
      type: object
      additionalProperties: false
      required:
        [
          tenantId,
          slug,
          visibilityStatus,
          verificationStatus,
          publishedAt,
          publicPath,
          readyToPublish,
          readiness,
        ]
      properties:
        tenantId: { type: string, format: uuid }
        slug: { type: string }
        visibilityStatus: { type: string, enum: [DRAFT, PUBLISHED, SUSPENDED] }
        verificationStatus: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED, REJECTED] }
