        displayName: { type: string }
        bio: { type: [string, 'null'] }
        bookingEnabled: { type: boolean }
        sortOrder: { type: integer, minimum: 0 }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        serviceIds:
