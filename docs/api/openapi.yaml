        rejectionCode: { type: [string, 'null'] }
    PortfolioItem:
      type: object
      additionalProperties: false
      required: [id, staffId, serviceId, title, description, tags, status, sortOrder, media]
      properties:
        id: { type: string, format: uuid }
        staffId: { type: [string, 'null'], format: uuid }
        serviceId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        description: { type: [string, 'null'] }
        tags:
          type: array
          items: { type: string }
        status: { type: string, enum: [DRAFT, PUBLISHED, HIDDEN] }
        sortOrder: { type: integer, minimum: 0 }
        media: { $ref: '#/components/schemas/PortfolioMedia' }
    PortfolioEntitlementUsage:
      type: object
      additionalProperties: false
      required: [code, limit, used, remaining]
      properties:
        code: { type: string, const: MAX_PORTFOLIO_IMAGES }
        limit: { type: integer, minimum: 1 }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
    PortfolioResponse:
      type: object
      additionalProperties: false
      required: [tenantId, items, entitlement]
      properties:
        tenantId: { type: string, format: uuid }
        items:
          type: array
          items: { $ref: '#/components/schemas/PortfolioItem' }
        entitlement: { $ref: '#/components/schemas/PortfolioEntitlementUsage' }
    PortfolioUploadIntentResponse:
      type: object
      additionalProperties: false
      required: [portfolio, upload]
      properties:
        portfolio: { $ref: '#/components/schemas/PortfolioResponse' }
        upload:
          type: object
          additionalProperties: false
          required: [mediaAssetId, method, url, fields, expiresAt, maxBytes]
          properties:
            mediaAssetId: { type: string, format: uuid }
            method: { type: string, const: POST }
            url: { type: string, format: uri }
            fields:
              type: object
              additionalProperties: { type: string }
            expiresAt: { type: string, format: date-time }
            maxBytes: { type: integer, const: 15728640 }
    PortfolioUploadCompleteResponse:
      type: object
      additionalProperties: false
      required: [mediaAssetId, status]
      properties:
        mediaAssetId: { type: string, format: uuid }
