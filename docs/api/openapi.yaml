openapi: 3.1.0
info:
  title: Nook API
  version: 0.1.0
  description: Phase 1 identity, Phase 2 merchant, and Phase 3 booking contracts. Timestamps are UTC; product defaults use Asia/Taipei.
servers:
  - url: http://localhost:8080
paths:
  /v1/auth/line/exchange:
    post:
      operationId: exchangeLineIdentity
      summary: Verify a LINE ID token and issue an Identity Platform custom token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LineExchangeRequest' }
      responses:
        '200':
          description: Custom token contract; no cookie is created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LineExchangeResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '429':
          description: LINE exchange rate limit exceeded before provider verification
          headers:
            Retry-After:
              description: Whole seconds until the current fixed window ends
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants:
    post:
      operationId: createTenant
      summary: Create a tenant and OWNER membership atomically
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTenantRequest'
      responses:
        '201':
          {
            description: Tenant created,
            content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}:
    get:
      operationId: getTenant
      summary: Read a tenant through an active membership
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          {
            description: Tenant visible to the authenticated member,
            content: { application/json: { schema: { $ref: '#/components/schemas/Tenant' } } },
          }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/merchant-onboarding:
    get:
      operationId: getMerchantOnboarding
      summary: Read the tenant merchant onboarding aggregate as an active member
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Merchant profile, primary location, starter service, and readiness
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOnboardingResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    put:
      operationId: saveMerchantOnboarding
      summary: Atomically upsert the tenant merchant profile, primary location, and starter service
      description: Requires an active OWNER membership. Stable client resource UUIDs make retries idempotent.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MerchantOnboardingRequest' }
      responses:
        '200':
          description: Onboarding aggregate saved; profile remains draft and unverified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MerchantOnboardingResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/services:
    get:
      operationId: listServices
      summary: List the tenant service catalog and MAX_SERVICES usage
      description: Any active tenant member may read active and inactive services in stable sort order.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Tenant service catalog with its generic entitlement usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCatalogResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createService
      summary: Append an active service within the tenant entitlement
      description: Requires OWNER or MANAGER. Entitlement check and creation are serializable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateServiceRequest' }
      responses:
        '201':
          description: Service created and full catalog returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCatalogResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/services/order:
    put:
      operationId: reorderServices
      summary: Replace the complete tenant service ordering
      description: Requires OWNER or MANAGER. The request must contain every active and inactive service exactly once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderServicesRequest' }
      responses:
        '200':
          description: Reordered full catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCatalogResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/services/{serviceId}:
    patch:
      operationId: updateService
      summary: Update selected service fields
      description: Requires OWNER or MANAGER. At least one mutable field is required.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateServiceRequest' }
      responses:
        '200':
          description: Updated full catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCatalogResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/services/{serviceId}/status:
    put:
      operationId: changeServiceStatus
      summary: Activate or deactivate one service
      description: Requires OWNER or MANAGER. The final active service cannot be deactivated.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/ServiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeServiceStatusRequest' }
      responses:
        '200':
          description: Updated full catalog
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceCatalogResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff:
    get:
      operationId: listStaffAvailability
      summary: List tenant staff, weekly rules, exceptions, and MAX_STAFF usage
      description: Any active tenant member may read active and inactive staff scheduling data.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Staff scheduling aggregate in stable display order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createStaff
      summary: Create active staff within MAX_STAFF
      description: Requires OWNER or MANAGER. The entitlement check and creation are serializable.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateStaffRequest' }
      responses:
        '201':
          description: Staff created and full scheduling aggregate returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/order:
    put:
      operationId: reorderStaff
      summary: Replace the complete tenant staff ordering
      description: Requires OWNER or MANAGER. The request must contain every active and inactive staff ID exactly once.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderStaffRequest' }
      responses:
        '200':
          description: Reordered scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}:
    patch:
      operationId: updateStaff
      summary: Update selected staff profile and service assignments
      description: Requires OWNER or MANAGER. Location and services must be active and owned by the same tenant.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateStaffRequest' }
      responses:
        '200':
          description: Updated scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}/status:
    put:
      operationId: changeStaffStatus
      summary: Activate or deactivate one staff member
      description: Requires OWNER or MANAGER. The final active staff member cannot be deactivated; deactivation closes booking.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeStaffStatusRequest' }
      responses:
        '200':
          description: Updated scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}/weekly-schedule:
    put:
      operationId: replaceWeeklyAvailability
      summary: Atomically replace one staff member's weekly availability rules
      description: Requires OWNER or MANAGER. Rules use ISO weekday, a 15-minute grid, and non-overlapping date/time ranges.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReplaceWeeklyAvailabilityRequest' }
      responses:
        '200':
          description: Updated scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}/exceptions:
    post:
      operationId: createAvailabilityException
      summary: Create a UTC-backed availability exception
      description: Requires OWNER or MANAGER. Active exceptions for the same staff member cannot overlap.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAvailabilityExceptionRequest' }
      responses:
        '201':
          description: Exception created and full scheduling aggregate returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}/exceptions/{exceptionId}:
    patch:
      operationId: updateAvailabilityException
      summary: Update selected availability exception fields
      description: Requires OWNER or MANAGER. The merged final interval is validated against active exceptions.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateAvailabilityExceptionRequest' }
      responses:
        '200':
          description: Updated scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/staff/{staffId}/exceptions/{exceptionId}/status:
    put:
      operationId: changeAvailabilityExceptionStatus
      summary: Activate or cancel an availability exception without deleting it
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/StaffId'
        - $ref: '#/components/parameters/ExceptionId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangeAvailabilityExceptionStatusRequest' }
      responses:
        '200':
          description: Updated scheduling aggregate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffAvailabilityResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/me:
    get:
      operationId: getMe
      summary: Return the authenticated local user and memberships
      security:
        - bearerAuth: []
      responses:
        '200':
          {
            description: Current user summary,
            content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } },
          }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/portfolio:
    get:
      operationId: listPortfolio
      summary: List the tenant portfolio and MAX_PORTFOLIO_IMAGES usage
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Ordered non-deleted portfolio items and entitlement usage
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/portfolio/upload-intents:
    post:
      operationId: createPortfolioUploadIntent
      summary: Create DRAFT/PENDING metadata and a 15-minute direct upload policy
      description: Requires OWNER, MANAGER, or STAFF. The API controls bucket and object key and never receives image bytes.
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePortfolioUploadIntentRequest' }
      responses:
        '201':
          description: Metadata saved and exact signed POST policy returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioUploadIntentResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/portfolio/media/{mediaAssetId}/complete:
    post:
      operationId: completePortfolioUpload
      summary: Enqueue idempotent media verification after browser upload
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/MediaAssetId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '201':
          description: Verification task accepted; the media remains PENDING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioUploadCompleteResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/portfolio/order:
    put:
      operationId: reorderPortfolio
      summary: Replace the complete ordering of non-deleted tenant portfolio items
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReorderPortfolioRequest' }
      responses:
        '200':
          description: Reordered portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/portfolio/{portfolioItemId}:
    patch:
      operationId: updatePortfolioItem
      summary: Update tenant-owned portfolio metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PortfolioItemId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePortfolioItemRequest' }
      responses:
        '200':
          description: Updated portfolio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deletePortfolioItem
      summary: Soft-delete a tenant portfolio item and media metadata
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/PortfolioItemId'
      responses:
        '200':
          description: Remaining portfolio after soft delete
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PortfolioResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/media/verify:
    post:
      operationId: verifyPortfolioMedia
      summary: Private worker target for a Cloud Tasks OIDC request
      description: Cloud Run IAM is authoritative; x-cloudtasks-queuename is defense in depth only.
      security: [{ cloudTasksOidc: [] }]
      parameters:
        - name: x-cloudtasks-queuename
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyMediaTaskRequest' }
      responses:
        '201':
          description: Media reached a terminal READY or REJECTED state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerifyMediaTaskResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /v1/tenants/{tenantId}/publication:
    get:
      operationId: getMerchantPublication
      summary: Read merchant publication state and server-computed readiness
      security: [{ bearerAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/TenantId' }]
      responses:
        '200':
          description: Publication state visible to an active tenant member
          content:
            application/json:
