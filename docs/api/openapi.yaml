        publicPath: { type: string }
        readyToPublish: { type: boolean }
        readiness:
          type: array
          items: { $ref: '#/components/schemas/PublicationReadinessItem' }
    PublicMerchantResponse:
      type: object
      description: Explicit public allowlist. Private location data, phone, user IDs, storage keys, and exception reasons are excluded.
      additionalProperties: false
      required:
        [
          slug,
          name,
          category,
          description,
          verificationStatus,
          publishedAt,
          contact,
          location,
          services,
          staff,
          weeklyHours,
          portfolio,
          policies,
          bookingAvailability,
        ]
      properties:
        slug: { type: string }
        name: { type: string }
        category: { type: string, enum: [NAIL, LASH, BROW, BEAUTY, HAIR, OTHER] }
        description: { type: string }
        verificationStatus: { type: string, enum: [UNVERIFIED, PENDING, VERIFIED] }
        publishedAt: { type: string, format: date-time }
        contact: { type: object, additionalProperties: false }
        location:
          type: object
          description: name/address/postalCode are null when disclosure is DISTRICT_ONLY.
          additionalProperties: false
          required: [disclosure, name, address, postalCode, city, district, timezone]
          properties:
            disclosure: { type: string, enum: [FULL, DISTRICT_ONLY] }
            name: { type: [string, 'null'] }
            address: { type: [string, 'null'] }
            postalCode: { type: [string, 'null'] }
            city: { type: string }
            district: { type: string }
            timezone: { type: string, const: Asia/Taipei }
        services: { type: array, items: { type: object } }
        staff: { type: array, items: { type: object } }
        weeklyHours: { type: array, items: { type: object } }
        portfolio: { type: array, items: { type: object } }
        policies: { type: object, additionalProperties: false }
        bookingAvailability: { type: string, const: CANDIDATE_SLOTS }
    PublicAvailabilityResponse:
      type: object
      description: Explicit public allowlist. This is a point-in-time calculation, not a hold.
      additionalProperties: false
      required: [timezone, generatedAt, reservation, service, staff, slots]
      properties:
        timezone: { type: string, description: Merchant IANA timezone }
        generatedAt: { type: string, format: date-time }
        reservation: { type: boolean, const: false }
        service:
          type: object
          additionalProperties: false
          required: [id, name, durationMinutes]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            durationMinutes: { type: integer }
        staff:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [id, displayName]
            properties:
              id: { type: string, format: uuid }
              displayName: { type: string }
        slots:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [startAt, endAt, eligibleStaffIds]
            properties:
              startAt: { type: string, format: date-time }
              endAt: { type: string, format: date-time }
              eligibleStaffIds:
                type: array
                uniqueItems: true
                items: { type: string, format: uuid }
    CreateBookingHoldRequest:
      type: object
      additionalProperties: false
      required: [serviceId, startAt]
      properties:
        serviceId: { type: string, format: uuid }
        staffId:
          type: string
          format: uuid
          description: Omit for stable server-side any-staff selection.
        startAt:
          type: string
          format: date-time
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$'
          description: UTC instant with millisecond precision and a trailing Z. Client-supplied duration, price, tenant, consumer, buffer, and expiry are rejected.
    BookingHoldResponse:
      type: object
      description: Public allowlist for a temporary hold. It is not an appointment and never includes buffer, occupancy, tenant ID, consumer data, or a private address.
      additionalProperties: false
      required:
        [
          id,
          bookingState,
          status,
          appointmentCreated,
          timezone,
          startAt,
          endAt,
          expiresAt,
          policies,
          service,
          staff,
        ]
      properties:
        id: { type: string, format: uuid }
        bookingState: { type: string, const: HELD }
        status: { type: string, enum: [ACTIVE, RELEASED, EXPIRED, CONSUMED] }
        appointmentCreated: { type: boolean, const: false }
        timezone: { type: string, description: Merchant IANA timezone }
        startAt: { type: string, format: date-time, description: UTC service start }
        endAt: { type: string, format: date-time, description: UTC service end }
        expiresAt:
          {
            type: string,
            format: date-time,
            description: Original server expiry; replay never extends it,
          }
        policies:
          type: object
          additionalProperties: false
          required:
            [
              version,
              bookingPolicy,
              cancellationPolicy,
              consumerCancelLeadMinutes,
              consumerRescheduleLeadMinutes,
              cancelUntil,
              rescheduleUntil,
              cancelUntilInclusive,
              rescheduleUntilInclusive,
            ]
          properties:
            version: { type: string, pattern: '^v[12]:[0-9a-f]{64}$' }
            bookingPolicy: { type: string, minLength: 1 }
            cancellationPolicy: { type: string, minLength: 1 }
            consumerCancelLeadMinutes: { type: integer, minimum: 0, maximum: 43200 }
            consumerRescheduleLeadMinutes: { type: integer, minimum: 0, maximum: 43200 }
            cancelUntil: { $ref: '#/components/schemas/CanonicalUtcTimestamp' }
            rescheduleUntil: { $ref: '#/components/schemas/CanonicalUtcTimestamp' }
            cancelUntilInclusive: { type: boolean }
            rescheduleUntilInclusive: { type: boolean }
        service:
          type: object
          additionalProperties: false
          required:
            [id, name, durationMinutes, priceType, priceAmount, priceMin, priceMax, currency]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            durationMinutes: { type: integer, minimum: 5, maximum: 720 }
            priceType: { type: string, enum: [FIXED, FROM, RANGE, QUOTE] }
            priceAmount: { type: [integer, 'null'], minimum: 0 }
            priceMin: { type: [integer, 'null'], minimum: 0 }
            priceMax: { type: [integer, 'null'], minimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
          oneOf:
            - properties:
                priceType: { const: FIXED }
                priceAmount: { type: integer, minimum: 0 }
                priceMin: { type: 'null' }
                priceMax: { type: 'null' }
            - properties:
                priceType: { const: FROM }
                priceAmount: { type: integer, minimum: 0 }
                priceMin: { type: 'null' }
                priceMax: { type: 'null' }
            - properties:
                priceType: { const: RANGE }
                priceAmount: { type: 'null' }
                priceMin: { type: integer, minimum: 0 }
                priceMax: { type: integer, minimum: 0 }
            - properties:
                priceType: { const: QUOTE }
                priceAmount: { type: 'null' }
                priceMin: { type: 'null' }
                priceMax: { type: 'null' }
        staff:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
    CreateAppointmentRequest:
      type: object
      additionalProperties: false
      required: [holdId, policiesAccepted, policyVersion]
      properties:
        holdId:
          type: string
          description: Malformed UUID values are mapped to the same privacy-safe 404 as unknown holds.
        policiesAccepted: { type: boolean, const: true }
        policyVersion: { type: string, pattern: '^v[12]:[0-9a-f]{64}$' }
    AppointmentResponse:
