            description: { type: [string, 'null'] }
            phone: { type: [string, 'null'] }
            lineOaUrl: { type: [string, 'null'], format: uri }
            instagramUrl: { type: [string, 'null'], format: uri }
            bookingPolicy: { type: [string, 'null'] }
            cancellationPolicy: { type: [string, 'null'] }
