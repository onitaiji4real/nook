        appointmentCreated: { type: boolean, const: true }
        status: { type: string, const: CONFIRMED }
        source: { type: string, enum: [MERCHANT_LINK, MARKETPLACE, ADMIN, STAFF, IMPORT] }
        pricingStatus: { type: string, enum: [EXACT, ESTIMATE, QUOTE_REQUIRED] }
        paymentStatus: { type: string, const: NOT_REQUIRED }
        timezone: { type: string, description: Snapshotted location IANA timezone }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        subtotalAmount: { type: [integer, 'null'], minimum: 0 }
        depositAmount: { type: integer, const: 0 }
        totalAmount: { type: [integer, 'null'], minimum: 0 }
        service:
          type: object
          additionalProperties: false
          required:
            [id, name, durationMinutes, priceType, priceAmount, priceMin, priceMax, currency]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            durationMinutes: { type: integer, minimum: 5, maximum: 720 }
            priceType: { type: string, enum: [FIXED, FROM, RANGE, QUOTE] }
            priceAmount: { type: [integer, 'null'], minimum: 0 }
            priceMin: { type: [integer, 'null'], minimum: 0 }
            priceMax: { type: [integer, 'null'], minimum: 0 }
            currency: { type: string, pattern: '^[A-Z]{3}$' }
        staff:
          type: object
          additionalProperties: false
          required: [id, displayName]
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        policies:
          type: object
          additionalProperties: false
          required:
            [
              version,
              bookingPolicy,
              cancellationPolicy,
              acceptedAt,
              consumerCancelLeadMinutes,
              consumerRescheduleLeadMinutes,
              cancelUntil,
              rescheduleUntil,
              cancelUntilInclusive,
              rescheduleUntilInclusive,
            ]
          properties:
            version: { type: string, pattern: '^v[12]:[0-9a-f]{64}$' }
            bookingPolicy: { type: string, minLength: 1 }
            cancellationPolicy: { type: string, minLength: 1 }
            acceptedAt: { type: string, format: date-time }
            consumerCancelLeadMinutes: { type: integer, minimum: 0, maximum: 43200 }
            consumerRescheduleLeadMinutes: { type: integer, minimum: 0, maximum: 43200 }
            cancelUntil: { $ref: '#/components/schemas/CanonicalUtcTimestamp' }
            rescheduleUntil: { $ref: '#/components/schemas/CanonicalUtcTimestamp' }
            cancelUntilInclusive: { type: boolean }
            rescheduleUntilInclusive: { type: boolean }
        location:
          type: object
          additionalProperties: false
          required: [name, addressText, postalCode, city, district]
          properties:
            name: { type: string }
            addressText: { type: string }
            postalCode: { type: [string, 'null'] }
            city: { type: string }
            district: { type: string }
    CanonicalUtcTimestamp:
      type: string
