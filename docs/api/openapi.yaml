      properties:
        rules:
          type: array
          maxItems: 42
          items: { $ref: '#/components/schemas/WeeklyAvailabilityRule' }
    AvailabilityException:
      type: object
      additionalProperties: false
      required: [id, type, startAt, endAt, reason, status]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [TIME_OFF, EXTRA_HOURS, BLOCK] }
        startAt: { type: string, format: date-time, description: UTC in responses }
        endAt: { type: string, format: date-time, description: UTC in responses }
