        description: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        staffId: { type: [string, 'null'], format: uuid }
        serviceId: { type: [string, 'null'], format: uuid }
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items: { type: string, minLength: 1, maxLength: 50 }
    ReorderPortfolioRequest:
      type: object
      additionalProperties: false
      required: [portfolioItemIds]
