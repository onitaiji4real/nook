  /v1/marketplace/merchants/{slug}/booking-holds:
    post:
      operationId: createBookingHold
      summary: Atomically hold one still-available candidate for ten minutes
      description: The authenticated consumer identity comes only from the verified bearer principal. The server recalculates availability, chooses a concrete staff member for any-staff requests, and never treats a hold as an appointment.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
        - name: Idempotency-Key
          in: header
          required: true
          description: UUID scoped to this consumer and create endpoint. Exact replay returns the original hold and expiry without extending it.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBookingHoldRequest' }
      responses:
        '201':
          description: Ten-minute hold created, or exact idempotent replay returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BookingHoldResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '429':
          description: More than ten distinct idempotency keys were attempted in the current ten-minute consumer window
          headers:
            Retry-After:
              description: Whole seconds until the fixed rate window ends
              schema: { type: integer, minimum: 1 }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/ProblemDetails' }
        '503': { $ref: '#/components/responses/Problem' }
