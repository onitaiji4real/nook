    post:
      operationId: deliverNotification
      summary: Deliver one database-owned notification job through LINE Push
      description: Private Cloud Run IAM is authoritative. The exact queue header and ID-only body are defense in depth. A 503 response requests Cloud Tasks retry; terminal and accepted outcomes return 200.
      security: [{ cloudTasksOidc: [] }]
      parameters:
        - name: x-cloudtasks-queuename
          in: header
          required: true
          schema: { type: string, minLength: 1, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [jobId]
              properties:
                jobId: { type: string, format: uuid }
      responses:
        '200':
          description: Job was accepted, replayed, truthfully skipped, dead-lettered, or already terminal
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [outcome]
                properties:
                  outcome:
                    type: string
                    enum: [success, accepted, replayed, skipped, dead_letter]
        '400': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
  /internal/booking-holds/expire:
    post:
      operationId: expireBookingHolds
      summary: Retry-safe private worker operation for expiring booking holds
      description: Private Cloud Run ingress and IAM-validated Scheduler OIDC are authoritative. The scheduler marker is defense in depth and must not be trusted as standalone authentication.
      security: [{ cloudSchedulerOidc: [] }]
      parameters:
        - name: x-cloudscheduler
          in: header
          required: true
          schema: { type: string, const: 'true' }
      responses:
        '201':
          description: Up to one hundred expired ACTIVE holds were transitioned
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [expiredCount]
                properties:
                  expiredCount: { type: integer, minimum: 0, maximum: 100 }
        '403': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Identity Platform ID token
    cloudTasksOidc:
      type: http
      scheme: bearer
      bearerFormat: Google-signed OIDC ID token validated by Cloud Run IAM
    cloudSchedulerOidc:
      type: http
      scheme: bearer
      bearerFormat: Google-signed OIDC ID token validated by Cloud Run IAM
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    StaffId:
      name: staffId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentId:
      name: appointmentId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AppointmentTransitionIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Visible ASCII, 16 to 128 characters. Stored only as SHA-256.
      schema: { type: string, minLength: 16, maxLength: 128, pattern: '^[!-~]+$' }
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PortfolioItemId:
      name: portfolioItemId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MediaAssetId:
      name: mediaAssetId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: RFC 9457 Problem Details with a stable Nook code
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/ProblemDetails' }
  schemas:
    NotificationDispatchResult:
      type: object
      additionalProperties: false
      required:
        [
          projectedCount,
          failedProjectionCount,
          expiredCount,
          enqueuedCount,
          deletedWebhookCount,
          operationalSnapshot,
        ]
      properties:
        projectedCount: { type: integer, minimum: 0, maximum: 100 }
        failedProjectionCount: { type: integer, minimum: 0, maximum: 100 }
        expiredCount: { type: integer, minimum: 0, maximum: 100 }
        enqueuedCount: { type: integer, minimum: 0, maximum: 100 }
        deletedWebhookCount: { type: integer, minimum: 0, maximum: 1000 }
        operationalSnapshot:
          $ref: '#/components/schemas/NotificationOperationalSnapshot'
    NotificationOperationalSnapshot:
      type: object
      additionalProperties: false
      description: Platform-wide aggregate counters only; contains no tenant, recipient or message data.
      required:
        [
          oldestPendingOutboxAgeSeconds,
          oldestDueJobDelaySeconds,
          deadLetterJobCount,
          retryableAttemptCount24h,
          acceptedAttemptCount24h,
          lineBudgetReservedCount,
          lineBudgetMonthlyCap,
          lineBudgetUtilizationBps,
        ]
      properties:
        oldestPendingOutboxAgeSeconds:
          type: [integer, 'null']
          minimum: 0
        oldestDueJobDelaySeconds:
          type: [integer, 'null']
          minimum: 0
        deadLetterJobCount: { type: integer, minimum: 0 }
        retryableAttemptCount24h: { type: integer, minimum: 0 }
        acceptedAttemptCount24h: { type: integer, minimum: 0 }
        lineBudgetReservedCount: { type: integer, minimum: 0 }
        lineBudgetMonthlyCap:
          type: [integer, 'null']
          minimum: 1
        lineBudgetUtilizationBps:
          type: [integer, 'null']
          minimum: 0
    LineExchangeRequest:
      type: object
      additionalProperties: false
      required: [idToken, nonce]
      properties:
        idToken: { type: string, minLength: 1, maxLength: 8192, writeOnly: true }
        nonce: { type: string, minLength: 16, maxLength: 256, writeOnly: true }
    LineExchangeResponse:
      type: object
      additionalProperties: false
      required: [customToken, expiresIn]
      properties:
        customToken: { type: string }
        expiresIn: { type: integer, const: 3600 }
    CreateTenantRequest:
      type: object
      additionalProperties: false
      required: [name, slug]
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        slug: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9]+(?:-[a-z0-9]+)*$' }
    Membership:
      type: object
      required: [role, status]
      properties:
        role: { type: string, enum: [OWNER, MANAGER, STAFF, VIEWER] }
        status: { type: string, enum: [ACTIVE, INVITED, SUSPENDED, REMOVED] }
    Tenant:
      type: object
      required: [id, name, slug, status, membership]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
        status: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
        membership: { $ref: '#/components/schemas/Membership' }
    Me:
      type: object
      required: [id, memberships]
      properties:
        id: { type: string, format: uuid }
        memberships:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Membership'
              - type: object
                required: [tenantId, tenantName, tenantSlug, tenantStatus, tenantTimezone]
                properties:
                  tenantId: { type: string, format: uuid }
                  tenantName: { type: string }
                  tenantSlug: { type: string }
                  tenantStatus: { type: string, enum: [ACTIVE, SUSPENDED, CLOSED] }
                  tenantTimezone: { type: string, description: Tenant IANA usage timezone }
    MerchantOnboardingRequest:
      type: object
      additionalProperties: false
      required: [profile, location, service]
      properties:
        profile: { $ref: '#/components/schemas/MerchantProfileInput' }
        location: { $ref: '#/components/schemas/MerchantLocationInput' }
        service: { $ref: '#/components/schemas/MerchantStarterServiceInput' }
    MerchantProfileInput:
      type: object
      additionalProperties: false
      required: [category]
      properties:
        category: { type: string, enum: [NAIL, LASH, BROW, BEAUTY, HAIR, OTHER] }
        description: { type: string, minLength: 1, maxLength: 2000 }
        phone: { type: string, minLength: 8, maxLength: 24, pattern: '^\+?[0-9][0-9 ()-]+$' }
        lineOaUrl:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL on lin.ee, line.me, or page.line.me
        instagramUrl:
          type: string
          format: uri
          maxLength: 2048
          description: HTTPS URL on instagram.com
        bookingPolicy: { type: string, minLength: 1, maxLength: 2000 }
        cancellationPolicy: { type: string, minLength: 1, maxLength: 2000 }
    MerchantLocationInput:
      type: object
      additionalProperties: false
      required: [id, name, addressText, city, district]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        addressText: { type: string, minLength: 1, maxLength: 500, writeOnly: true }
        postalCode: { type: string, minLength: 3, maxLength: 10 }
        city: { type: string, minLength: 1, maxLength: 80 }
        district: { type: string, minLength: 1, maxLength: 80 }
        isPublicAddress: { type: boolean, default: false }
    MerchantStarterServiceInput:
      type: object
      additionalProperties: false
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 720 }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 180, default: 0 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 180, default: 0 }
        price: { $ref: '#/components/schemas/ServicePrice' }
        bookingEnabled: { type: boolean, default: true }
    ServicePrice:
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type: { type: string, const: FIXED }
            amount: { type: integer, minimum: 0, maximum: 10000000 }
        - type: object
          additionalProperties: false
          required: [type, amount]
          properties:
            type: { type: string, const: FROM }
            amount: { type: integer, minimum: 0, maximum: 10000000 }
        - type: object
          additionalProperties: false
          required: [type, min, max]
          properties:
            type: { type: string, const: RANGE }
            min: { type: integer, minimum: 0, maximum: 10000000 }
            max: { type: integer, minimum: 0, maximum: 10000000, description: Must be >= min }
        - type: object
          additionalProperties: false
          required: [type]
          properties:
            type: { type: string, const: QUOTE }
      discriminator:
        propertyName: type
    CreateServiceRequest:
      type: object
      additionalProperties: false
      required: [id, name, durationMinutes, price]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, minLength: 1, maxLength: 2000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 720 }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 180, default: 0 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 180, default: 0 }
        price: { $ref: '#/components/schemas/ServicePrice' }
        bookingEnabled: { type: boolean, default: true }
    UpdateServiceRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        durationMinutes: { type: integer, minimum: 5, maximum: 720 }
        bufferBeforeMinutes: { type: integer, minimum: 0, maximum: 180 }
        bufferAfterMinutes: { type: integer, minimum: 0, maximum: 180 }
        price: { $ref: '#/components/schemas/ServicePrice' }
        bookingEnabled: { type: boolean }
    ChangeServiceStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ReorderServicesRequest:
      type: object
      additionalProperties: false
      required: [serviceIds]
      properties:
        serviceIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ServiceCatalogItem:
      type: object
      additionalProperties: false
      required:
        [
          id,
          name,
          description,
          durationMinutes,
          bufferBeforeMinutes,
          bufferAfterMinutes,
          price,
          currency,
          bookingEnabled,
          status,
          sortOrder,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, 'null'] }
        durationMinutes: { type: integer }
        bufferBeforeMinutes: { type: integer }
        bufferAfterMinutes: { type: integer }
        price: { $ref: '#/components/schemas/ServicePrice' }
        currency: { type: string, const: TWD }
        bookingEnabled: { type: boolean }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        sortOrder: { type: integer, minimum: 0 }
    ServiceEntitlementUsage:
      type: object
      additionalProperties: false
      required: [code, limit, used, remaining]
      properties:
        code: { type: string, const: MAX_SERVICES }
        limit: { type: integer, minimum: 0 }
        used: { type: integer, minimum: 0 }
        remaining: { type: integer, minimum: 0 }
    ServiceCatalogResponse:
      type: object
      additionalProperties: false
      required: [tenantId, services, entitlement]
      properties:
        tenantId: { type: string, format: uuid }
        services:
          type: array
          items: { $ref: '#/components/schemas/ServiceCatalogItem' }
        entitlement: { $ref: '#/components/schemas/ServiceEntitlementUsage' }
    CreateStaffRequest:
      type: object
      additionalProperties: false
      required: [id, locationId, displayName, serviceIds]
      properties:
        id: { type: string, format: uuid }
        locationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: string, minLength: 1, maxLength: 2000 }
        bookingEnabled: { type: boolean, default: true }
        serviceIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    UpdateStaffRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        locationId: { type: string, format: uuid }
        displayName: { type: string, minLength: 1, maxLength: 120 }
        bio: { type: [string, 'null'], minLength: 1, maxLength: 2000 }
        bookingEnabled: { type: boolean }
        serviceIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
    ChangeStaffStatusRequest:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [ACTIVE, INACTIVE] }
    ReorderStaffRequest:
      type: object
      additionalProperties: false
