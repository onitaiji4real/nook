name: CI

on:
  pull_request:
  push:
    branches:
      - phase1
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgis/postgis:16-3.5
        env:
          POSTGRES_DB: nook
          POSTGRES_PASSWORD: nook
          POSTGRES_USER: nook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nook -d nook"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_VERSION: ${{ github.sha }}
      DATABASE_URL: postgresql://nook:nook@localhost:5432/nook?schema=public
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.9.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Integration tests
        run: pnpm test:integration

      - name: Build
        run: pnpm build
