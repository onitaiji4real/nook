packages:
  - apps/*
  - packages/*

# CI installs package.json's pin explicitly. Local Homebrew pnpm may use a newer version
# allowed by engines without downloading the pin before every command.
pmOnFail: warn

injectWorkspacePackages: true

allowBuilds:
  '@firebase/util': true
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true

overrides:
  '@types/superagent': 8.1.10
  effect: 3.20.0
